{% extends 'layouts/app_base.html' %}
{% load static %}
{% block title %}Add Account{% endblock %}

{% block content %}

<div class="container-fluid mt-3">
    <div class="row justify-content-center">
        <div class="col-lg-12">
            <div class="card shadow-sm border-0" style="margin-top: 10px">
                <div class="card-header text-primary d-flex justify-content-between align-items-center" id="card-table-hearder">
                    <label class="mb-0">
                        ADD USER
                    </label>
                </div>
                <div class="card-body">
                    <div id="alert-section" class="alert d-none" role="alert">
                        Message
                    </div>

                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-floating mb-3">
                                <input type="text" id="first_name" class="form-control form-control-sm" placeholder=" " autocomplete="off">
                                <label for="first_name">First Name <span class="text-danger">*</span></label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating mb-3">
                                <input type="text" id="last_name" class="form-control form-control-sm" placeholder=" " autocomplete="off">
                                <label for="last_name">Last Name <span class="text-danger">*</span></label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-floating mb-3">
                                <input type="text" id="email" class="form-control form-control-sm" placeholder=" " autocomplete="off">
                                <label for="email">Email <span class="text-danger">*</span></label>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-floating mb-3">
                                <select id="role_id" class="form-control form-control-sm">
                                    <option value="2">Requestor</option>
                                    <option value="3">Approver</option>
                                </select>
                                <label>Role<strong class="text-danger">*</strong></label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-floating mb-3">
                                <input type="text" id="username" class="form-control form-control-sm" placeholder=" " autocomplete="off">
                                <label for="username">Username <span class="text-danger">*</span></label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating mb-3">
                                <input type="password" id="password" class="form-control form-control-sm" placeholder=" " autocomplete="off">
                                <label for="password">Password <span class="text-danger">*</span></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-gray-light d-flex justify-content-end">
                    <a href="{% url 'account_list' %}"
                        class="btn btn-default btn-sm mr-2"
                        title="Back"
                        onclick="ShowLoading()"
                        id="card-button-footer">
                            <i class="fa fa-arrow-left mr-1"></i> Back
                        </a>

                    <button type="submit"
                            class="btn btn-default btn-sm"
                            onclick="confirmSave()"
                            id="card-button-footer">
                        <i class="fa fa-save mr-1"></i> Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function confirmSave() {
        showConfirmation({
            title: "Save New User",
            message: "Continue Saving?",
            subMessage: "",
            confirmText: "Yes, Save",
            confirmClass: "btn-success",
            icon: "fa-save",
            iconColor: "text-success",
            onConfirm: function () {
                SaveUser();
            }
        });
    }

    function SaveUser() {

         $.ajax({
            url: "{% url 'add_account' %}",
            type: "POST",
                data: {
                    first_name: $('#first_name').val(),
                    last_name: $('#last_name').val(),
                    email: $('#email').val(),
                    role_id: $('#role_id').val(),
                    username: $('#username').val(),
                    password: $('#password').val(),
                    csrfmiddlewaretoken: $('input[name=csrfmiddlewaretoken]').val()
                },
                success: function(response) {
                    showAlert("User Saved Successfully", "success");

                    setTimeout(function(){
                        window.location.href =
                            "{% url 'account_list' %}";

                    }, 3000);
                },
                error: function(xhr, status, error) {
                    showAlert("Error saving user", "error");
                    console.error(xhr.responseText);
                }
        });
    }
</script>


{% endblock %}
