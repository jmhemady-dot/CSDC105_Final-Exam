{% extends 'layouts/app_base.html' %}
{% load static %}
{% block title %}Add Facility{% endblock %}

{% block content %}


<div class="container-fluid mt-3">
    <div class="row justify-content-center">
        <div class="col-lg-12">
            <div class="card shadow-sm border-0" style="margin-top: 10px">
                <div class="card-header text-primary d-flex justify-content-between align-items-center" id="card-table-hearder">
                    <label class="mb-0">
                        ADD FACILITY
                    </label>
                </div>

                <div class="card-body">
                    <div id="alert-section" class="alert d-none" role="alert">
                        Message
                    </div>

                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-5">
                            <div class="form-floating mb-3">
                                <input type="text" id="facility_name" class="form-control form-control-sm" placeholder=" " autocomplete="off">
                                <label for="facility_name">Facility Name <span class="text-danger">*</span></label>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <div class="form-floating mb-3">
                                <input type="text" id="location" class="form-control form-control-sm" placeholder=" " autocomplete="off">
                                <label for="location">Location <span class="text-danger">*</span></label>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-floating mb-3">
                                <input type="number" id="capacity" class="form-control form-control-sm" placeholder=" " autocomplete="off">
                                <label for="capacity">Capacity <span class="text-danger">*</span></label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-gray-light d-flex justify-content-end">
                    <a href="{% url 'facility_list' %}"
                        class="btn btn-default btn-sm mr-2"
                        title="Back"
                        onclick="ShowLoading()"
                        id="card-button-footer">
                            <i class="fa fa-arrow-left mr-1"></i> Back
                        </a>

                    <button type="submit"
                            class="btn btn-default btn-sm"
                            onclick="confirmSave()"
                            id="card-button-footer">
                        <i class="fa fa-save mr-1"></i> Save
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function confirmSave() {
        showConfirmation({
            title: "Save New Facility",
            message: "Continue Saving?",
            subMessage: "",
            confirmText: "Yes, Save",
            confirmClass: "btn-success",
            icon: "fa-save",
            iconColor: "text-success",
            onConfirm: function () {
                SaveResource();
            }
        });
    }

    function SaveResource() {

         $.ajax({
            url: "{% url 'add_facility' %}",
            type: "POST",
                data: {
                    facility_name: $('#facility_name').val(),
                    location: $('#location').val(),
                    capacity: $('#capacity').val(),
                    csrfmiddlewaretoken: $('input[name=csrfmiddlewaretoken]').val()
                },
                success: function(response) {
                    showAlert("Facility Saved Successfully", "success");

                    setTimeout(function(){
                        window.location.href =
                            "{% url 'facility_list' %}";

                    }, 3000);
                },
                error: function(xhr, status, error) {
                    showAlert("Error saving facility", "error");
                    console.error(xhr.responseText);
                }
        });
    }
</script>

{% endblock %}
